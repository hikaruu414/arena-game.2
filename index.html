<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Arena Battle 3D</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!--======================================================
        HUD
    =======================================================-->

    <div id="gameUI">

        <div id="hp">
            HP :
            <span id="playerHP">500</span>
        </div>

        <div id="enemyHP">
            Enemy :
            <span id="enemyHealth">500</span>
        </div>

    </div>

    <!--======================================================
        PLAYER HP BAR
    =======================================================-->

    <div id="playerBar">
        <div id="playerHealthBar"></div>
    </div>

    <!--======================================================
    MOBILE CONTROL
=======================================================-->

<div id="mobileControls">

    <div id="dpad">

        <button
            type="button"
            id="up"
            class="moveButton">
            ▲
        </button>

        <button
            type="button"
            id="left"
            class="moveButton">
            ◀
        </button>

        <div id="dpadCenter"></div>

        <button
            type="button"
            id="right"
            class="moveButton">
            ▶
        </button>

        <button
            type="button"
            id="down"
            class="moveButton">
            ▼
        </button>

    </div>

    <button
        type="button"
        id="attack">
        ⚔
    </button>

</div>
    <!--======================================================
        GAME INFO
    =======================================================-->

    <div class="hint">

        <b>PC</b><br>

        W A S D = Bergerak<br>
        SPACE / Klik Kiri = Attack<br>
        ESC = Pause

        <br><br>

        <b>Mobile</b><br>

        Gunakan tombol di layar.

    </div>

    <!--======================================================
        THREE.JS
    =======================================================-->

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <!--======================================================
        GAME FILES
    =======================================================-->

    <script src="./arena.js"></script>
<script src="./player.js"></script>
<script src="./enemy.js"></script>
<script src="./minion.js"></script>
<script src="./tower.js"></script>
<script src="./base.js"></script>
<script src="./ui.js"></script>
<script src="./main.js"></script>>

</body>

</html>
